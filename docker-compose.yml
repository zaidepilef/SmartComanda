name: smartcomanda

services:

  postgres:
    image: postgres:16
    container_name: smartcomanda_postgres
    restart: unless-stopped

    entrypoint: ["/postgres/entrypoint.sh"]

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
    
      - "5432:5432"

    volumes:
      - smartcomanda_postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./postgres/init.d:/init.d
      - ./postgres/entrypoint.sh:/postgres/entrypoint.sh:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - smartcomanda_network



  pgadmin:
    image: dpage/pgadmin4
    container_name: smartcomanda_pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}

    ports:
      - "8080:80"

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - smartcomanda_pgadmin_data:/var/lib/pgadmin

    networks:
      - smartcomanda_network



  api:
    build:
      context: ./SmartComanda_api
      target: dev

    container_name: smartcomanda_api
    restart: unless-stopped

    environment:
      PORT: ${PORT}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-true}

    ports:
      - "3000:3000"

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - ./SmartComanda_api:/app
      - smartcomanda_backend_node_modules:/app/node_modules

    networks:
      - smartcomanda_network



  angular_admin:
    build:
      context: ./SmartComanda_admin
      target: dev

    container_name: smartcomanda_admin
    restart: unless-stopped

    command: ["npm", "start", "--", "--host", "0.0.0.0"]

    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"

    env_file:
      - path: ./SmartComanda_admin/.env
        required: false

    ports:
      - "4200:4200"

    depends_on:
      - api

    volumes:
      - ./SmartComanda_admin:/app
      - smartcomanda_frontend_node_modules:/app/node_modules
      - smartcomanda_frontend_angular_cache:/app/.angular

    networks:
      - smartcomanda_network



  angular_pos:
    build:
      context: ./SmartComanda_pos
      target: dev

    container_name: smartcomanda_pos
    restart: unless-stopped

    command: ["npm", "start", "--", "--host", "0.0.0.0", "--port", "4201"]

    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"

    env_file:
      - path: ./SmartComanda_pos/.env
        required: false

    ports:
      - "4201:4201"

    depends_on:
      - api

    volumes:
      - ./SmartComanda_pos:/app
      - smartcomanda_pos_node_modules:/app/node_modules
      - smartcomanda_pos_angular_cache:/app/.angular

    networks:
      - smartcomanda_network



  angular_client:
    build:
      context: ./SmartComanda_client
      target: dev

    container_name: smartcomanda_client
    restart: unless-stopped

    command: ["npm", "start", "--", "--host", "0.0.0.0", "--port", "4202"]

    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"

    env_file:
      - path: ./SmartComanda_client/.env
        required: false

    ports:
      - "4202:4202"

    depends_on:
      - api

    volumes:
      - ./SmartComanda_client:/app
      - smartcomanda_client_node_modules:/app/node_modules
      - smartcomanda_client_angular_cache:/app/.angular

    networks:
      - smartcomanda_network



networks:
  smartcomanda_network:
    name: smartcomanda_network



volumes:
  smartcomanda_postgres_data:
    name: smartcomanda_postgres_data

  smartcomanda_pgadmin_data:
    name: smartcomanda_pgadmin_data

  smartcomanda_backend_node_modules:
    name: smartcomanda_backend_node_modules

  smartcomanda_frontend_node_modules:
    name: smartcomanda_frontend_node_modules

  smartcomanda_frontend_angular_cache:
    name: smartcomanda_frontend_angular_cache

  smartcomanda_pos_node_modules:
    name: smartcomanda_pos_node_modules

  smartcomanda_pos_angular_cache:
    name: smartcomanda_pos_angular_cache

  smartcomanda_client_node_modules:
    name: smartcomanda_client_node_modules

  smartcomanda_client_angular_cache:
    name: smartcomanda_client_angular_cache
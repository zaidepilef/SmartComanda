version: "3.9"

name: smartcomanda

services:
  ollama:
    container_name: smartcomanda_ollama  
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - smartcomanda_ollama_models:/root/.ollama
    networks:
      - smartcomanda_network
    deploy:
        resources:
          reservations:
            devices:
              - driver: nvidia
                count: all
                capabilities: [gpu]

  postgres:
    image: postgres:16
    container_name: smartcomanda_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123

    ports:

      - "5432:5432"

    volumes:
      - smartcomanda_postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - smartcomanda_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: smartcomanda_pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.com
      PGADMIN_DEFAULT_PASSWORD: admin123

    ports:
      - "8080:80"

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - smartcomanda_pgadmin_data:/var/lib/pgadmin

    networks:
      - smartcomanda_network

  api:
    build:
      context: ./backend

    container_name: smartcomanda_api
    restart: unless-stopped

    environment:
      PORT: 3000
      DATABASE_URL: postgresql://admin:admin123@postgres:5432/restaurant_saas
      JWT_SECRET: supersecretkey

    ports:
      - "3000:3000"

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - ./backend:/app
      - smartcomanda_backend_node_modules:/app/node_modules

    networks:
      - smartcomanda_network

  n8n:
    image: n8nio/n8n
    container_name: smartcomanda_n8n
    restart: unless-stopped

    ports:
      - "5678:5678"

    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n_db
      DB_POSTGRESDB_USER: admin
      DB_POSTGRESDB_PASSWORD: admin123

      N8N_HOST: smartcomanda_n8n
      N8N_PORT: 5678
      WEBHOOK_URL: http://localhost:5678/

      GENERIC_TIMEZONE: America/Santiago

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - smartcomanda_n8n_data:/home/node/.n8n

    networks:
      - smartcomanda_network

  angular_admin:
    build:
      context: ./frontend-admin

    container_name: smartcomanda_admin
    restart: unless-stopped

    ports:
      - "4200:80"

    depends_on:
      - api

    networks:
      - smartcomanda_network

networks:
  smartcomanda_network:
    name: smartcomanda_network

volumes:
  smartcomanda_ollama_models:
    name: smartcomanda_ollama_models
  
  smartcomanda_postgres_data:
    name: smartcomanda_postgres_data

  smartcomanda_pgadmin_data:
    name: smartcomanda_pgadmin_data

  smartcomanda_n8n_data:
    name: smartcomanda_n8n_data

  smartcomanda_backend_node_modules:
    name: smartcomanda_backend_node_modules
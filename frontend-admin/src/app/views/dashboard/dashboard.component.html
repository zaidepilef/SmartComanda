<div class="fade-in">
  <c-row>
    @for (card of statCards; track card.title) {
      <c-col xs="12" sm="6" xl="3">
        <c-card class="mb-4 text-white" [color]="card.color">
          <c-card-body class="d-flex justify-content-between align-items-center">
            <div>
              <h6 class="text-uppercase fw-semibold mb-0">{{ card.title }}</h6>
              <div class="fs-3 fw-bold mt-2">{{ card.value }}</div>
            </div>
            <svg cIcon [name]="card.icon" size="xl" class="text-white opacity-75"></svg>
          </c-card-body>
        </c-card>
      </c-col>
    }
  </c-row>

  <c-row>
    <c-col xs="12">
      <c-card class="mb-4">
        <c-card-header>
          <h5 class="card-title mb-0">Pedidos de la semana</h5>
        </c-card-header>
        <c-card-body>
          <c-chart
            [type]="chartType"
            [data]="chartData"
            [options]="chartOptions"
          />
        </c-card-body>
      </c-card>
    </c-col>
  </c-row>

  <c-row>
    <c-col xs="12">
      <c-card class="mb-4">
        <c-card-header>
          <h5 class="card-title mb-0">Pedidos recientes</h5>
        </c-card-header>
        <c-card-body>
          <table cTable [striped]="true">
            <thead>
              <tr>
                <th scope="col">#</th>
                <th scope="col">Mesa</th>
                <th scope="col">Items</th>
                <th scope="col">Total</th>
                <th scope="col">Estado</th>
              </tr>
            </thead>
            <tbody>
              @for (order of recentOrders; track order.id) {
                <tr>
                  <th scope="row">{{ order.id }}</th>
                  <td>{{ order.table }}</td>
                  <td>{{ order.items }}</td>
                  <td>{{ order.total }}</td>
                  <td>
                    <span
                      class="badge"
                      [ngClass]="order.status === 'Pendiente' ? 'text-bg-warning' : order.status === 'En preparación' ? 'text-bg-info' : 'text-bg-success'"
                    >
                      {{ order.status }}
                    </span>
                  </td>
                </tr>
              }
            </tbody>
          </table>
        </c-card-body>
      </c-card>
    </c-col>
  </c-row>
</div>

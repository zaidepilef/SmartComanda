<c-card class="mb-4">
  <c-card-header>
    <h5 class="card-title mb-0">Productos</h5>
  </c-card-header>
  <c-card-body>
    <table cTable [hover]="true">
      <thead>
        <tr>
          <th scope="col">#</th>
          <th scope="col">Producto</th>
          <th scope="col">Categoría</th>
          <th scope="col">Precio</th>
          <th scope="col">Stock</th>
        </tr>
      </thead>
      <tbody>
        @for (product of products; track product.name; let i = $index) {
          <tr>
            <th scope="row">{{ i + 1 }}</th>
            <td>{{ product.name }}</td>
            <td>{{ product.category }}</td>
            <td>{{ product.price }}</td>
            <td>{{ product.stock }}</td>
          </tr>
        }
      </tbody>
    </table>
  </c-card-body>
</c-card>

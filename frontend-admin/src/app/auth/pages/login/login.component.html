<div class="bg-body-tertiary min-vh-100 d-flex align-items-center justify-content-center p-3">
  <div class="card shadow-sm w-100" style="max-width: 400px;">
    <div class="card-body p-4">
      <h2 class="fw-semibold text-center mb-1">SmartComanda Admin</h2>
      <p class="text-body-secondary text-center mb-4">Inicia sesión en tu cuenta</p>

      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="mb-3">
          <label class="form-label" for="email">Email</label>
          <input
            id="email"
            type="email"
            class="form-control"
            formControlName="email"
            autocomplete="email"
            placeholder="admin@example.com"
          />
        </div>

        <div class="mb-3">
          <label class="form-label" for="password">Contraseña</label>
          <input
            id="password"
            type="password"
            class="form-control"
            formControlName="password"
            autocomplete="current-password"
            placeholder="••••••••"
          />
        </div>

        @if (error) {
          <div class="alert alert-danger py-2" role="alert">{{ error }}</div>
        }

        <button
          type="submit"
          class="btn btn-primary w-100"
          [disabled]="form.invalid || loading"
        >
          {{ loading ? 'Iniciando sesión...' : 'Iniciar sesión' }}
        </button>
      </form>

      <p class="text-center mt-3 mb-0">
        ¿No tienes una cuenta?
        <a routerLink="/register" class="text-decoration-none">Regístrate</a>
      </p>
    </div>
  </div>
</div>

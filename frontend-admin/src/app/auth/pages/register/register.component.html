<div class="bg-body-tertiary min-vh-100 d-flex align-items-center justify-content-center p-3">
  <div class="card shadow-sm w-100" style="max-width: 420px;">
    <div class="card-body p-4">
      <h2 class="fw-semibold text-center mb-1">Crear cuenta</h2>
      <p class="text-body-secondary text-center mb-4">Regístrate para acceder al panel</p>

      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="row">
          <div class="col-12 col-sm-6 mb-3">
            <label class="form-label" for="firstName">Nombre</label>
            <input
              id="firstName"
              type="text"
              class="form-control"
              formControlName="firstName"
              autocomplete="given-name"
            />
          </div>

          <div class="col-12 col-sm-6 mb-3">
            <label class="form-label" for="lastName">Apellido</label>
            <input
              id="lastName"
              type="text"
              class="form-control"
              formControlName="lastName"
              autocomplete="family-name"
            />
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label" for="email">Email</label>
          <input
            id="email"
            type="email"
            class="form-control"
            formControlName="email"
            autocomplete="email"
            placeholder="admin@example.com"
          />
        </div>

        <div class="mb-3">
          <label class="form-label" for="password">Contraseña</label>
          <input
            id="password"
            type="password"
            class="form-control"
            formControlName="password"
            autocomplete="new-password"
            placeholder="Mínimo 8 caracteres"
          />
        </div>

        @if (error) {
          <div class="alert alert-danger py-2" role="alert">{{ error }}</div>
        }

        <button
          type="submit"
          class="btn btn-primary w-100"
          [disabled]="form.invalid || loading"
        >
          {{ loading ? 'Creando cuenta...' : 'Crear cuenta' }}
        </button>
      </form>

      <p class="text-center mt-3 mb-0">
        ¿Ya tienes una cuenta?
        <a routerLink="/login" class="text-decoration-none">Inicia sesión</a>
      </p>
    </div>
  </div>
</div>
